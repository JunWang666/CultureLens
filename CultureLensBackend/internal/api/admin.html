<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CultureLens 内容管理</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f0e8; --panel:#fffdf8; --ink:#172532; --muted:#66717a; --line:#d9d1c4; --accent:#a5482d; --ok:#24724d; --bad:#a12d2d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; }
    main { width:min(1180px,calc(100% - 28px)); margin:32px auto 64px; }
    header { display:flex; gap:20px; align-items:end; justify-content:space-between; margin-bottom:22px; }
    h1 { margin:0; font:700 clamp(28px,4vw,44px)/1.08 ui-serif,serif; }
    h2 { margin:0 0 12px; font-size:19px; }
    p { margin:6px 0; color:var(--muted); }
    a { color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .wide { grid-column:1/-1; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 12px 32px rgba(30,35,40,.06); }
    label { display:grid; gap:6px; margin:10px 0; color:var(--muted); font-size:13px; font-weight:650; }
    input,textarea,select,button { font:inherit; }
    input,textarea,select { width:100%; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); padding:10px 12px; }
    textarea { min-height:112px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
    button { border:1px solid var(--line); border-radius:999px; padding:9px 15px; background:transparent; color:var(--ink); cursor:pointer; }
    button.primary { border-color:var(--accent); background:var(--accent); color:#fff; }
    button:disabled { opacity:.55; cursor:wait; }
    .stats { display:flex; gap:20px; flex-wrap:wrap; }
    .stat strong { display:block; font-size:25px; }
    .list { display:grid; gap:8px; max-height:310px; overflow:auto; margin-top:14px; }
    .item { border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .item small { display:block; color:var(--muted); overflow-wrap:anywhere; }
    .item button { padding:5px 10px; font-size:13px; flex:none; }
    .status { white-space:pre-wrap; overflow-wrap:anywhere; border-radius:12px; padding:12px; background:rgba(100,100,100,.08); color:var(--muted); }
    .status.ok { color:var(--ok); } .status.bad { color:var(--bad); }
    @media (max-width:760px) { .grid,.row { grid-template-columns:1fr; } header { align-items:start; flex-direction:column; } }
    @media (prefers-color-scheme:dark) { :root { --bg:#111820; --panel:#18222c; --ink:#f3eee5; --muted:#aeb7bf; --line:#35424c; --accent:#d77b5d; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><p>CultureLens Backend</p><h1>文化内容管理</h1><p>入口访问由 Cloudflare Zero Trust 管理；所有数据请求只发往当前服务。</p></div>
    <div><a href="/admin/recognitions">最近识别请求</a> · <a href="/debug">查询调试台</a> · <a href="/docs">公开 API 文档</a></div>
  </header>

  <section class="card wide">
    <h2>内容概览</h2>
    <div class="actions"><button class="primary" id="refresh" type="button">刷新内容</button></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="grid" style="margin-top:16px">
    <form class="card" id="element-form">
      <h2>文化元素</h2>
      <label>Key<input id="element-key" required placeholder="west-lake-scenic-naming"></label>
      <label>名称<input id="element-name" required></label>
      <label>介绍正文<textarea id="element-text" required></textarea></label>
      <div class="actions"><button class="primary">保存元素</button><button type="reset">清空</button></div>
      <div class="list" id="element-list"></div>
    </form>

    <form class="card" id="attraction-form">
      <h2>景点</h2>
      <label>Key<input id="attraction-key" required placeholder="leifeng-pagoda"></label>
      <label>名称<input id="attraction-name" required></label>
      <div class="actions"><button class="primary">保存景点</button><button type="reset">清空</button></div>
      <div class="list" id="attraction-list"></div>
    </form>

    <form class="card wide" id="introduction-form">
      <h2>景点特定介绍与坐标</h2>
      <div class="row">
        <label>Key<input id="introduction-key" required placeholder="leifeng-pagoda.lake-landscape"></label>
        <label>名称<input id="introduction-name" required></label>
      </div>
      <label>介绍正文<textarea id="introduction-text" required></textarea></label>
      <div class="row">
        <label>文化元素<select id="introduction-element" required></select></label>
        <label>景点<select id="introduction-attraction" required></select></label>
      </div>
      <div class="row">
        <label>Latitude<input id="latitude" type="number" min="-90" max="90" step="any" required></label>
        <label>Longitude<input id="longitude" type="number" min="-180" max="180" step="any" required></label>
      </div>
      <div class="actions"><button class="primary">保存介绍</button><button type="reset">清空</button></div>
      <div class="list" id="introduction-list"></div>
    </form>

    <form class="card wide" id="relation-form">
      <h2>新增文化元素关联</h2>
      <div class="row">
        <label>元素 A<select id="relation-a" required></select></label>
        <label>元素 B<select id="relation-b" required></select></label>
      </div>
      <div class="actions"><button class="primary">保存关联</button></div>
      <div class="list" id="relation-list"></div>
    </form>

    <section class="card wide"><h2>操作结果</h2><div class="status" id="status">正在读取内容…</div></section>
  </section>
</main>
<script>
  const state = { content: { elements:[], attractions:[], relations:[], introductions:[] } };
  const $ = selector => document.querySelector(selector);

  function richText(text) {
    return { schemaVersion: 1, blocks: String(text).split(/\n+/).map(value => value.trim()).filter(Boolean).map(text => ({ type:'paragraph', text })) };
  }
  function plainText(document) { return (document?.blocks || []).map(block => block.text || '').filter(Boolean).join('\n\n'); }
  function headers() { return { 'Accept':'application/json', 'Content-Type':'application/json' }; }
  function show(message, ok=false) { const node=$('#status'); node.className=`status ${ok?'ok':'bad'}`; node.textContent=message; }
  function escapeHTML(value) { return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }

  async function request(path, options={}) {
    const response = await fetch(path, { ...options, headers:{...headers(), ...(options.headers || {})} });
    const text = await response.text();
    let body; try { body = JSON.parse(text); } catch { body = text; }
    if (!response.ok) throw new Error(`${response.status} · ${body?.error?.message || text || '请求失败'}`);
    show(`${response.status} · ${response.headers.get('X-Request-ID') || '—'}\n${JSON.stringify(body,null,2)}`, true);
    return body;
  }

  async function refresh() {
    state.content = await request('/v1/admin/content');
    render();
  }

  function options(items) { return items.map(item => `<option value="${escapeHTML(item.key)}">${escapeHTML(item.name)} · ${escapeHTML(item.key)}</option>`).join(''); }
  function render() {
    const {elements, attractions, relations, introductions} = state.content;
    $('#stats').innerHTML = `<div class="stat"><strong>${elements.length}</strong>文化元素</div><div class="stat"><strong>${attractions.length}</strong>景点</div><div class="stat"><strong>${introductions.length}</strong>景点介绍</div><div class="stat"><strong>${relations.length}</strong>关联</div>`;
    $('#element-list').innerHTML = elements.map((item,index) => `<div class="item"><div><b>${escapeHTML(item.name)}</b><small>${escapeHTML(item.key)}</small></div><button type="button" data-element="${index}">编辑</button></div>`).join('');
    $('#attraction-list').innerHTML = attractions.map((item,index) => `<div class="item"><div><b>${escapeHTML(item.name)}</b><small>${escapeHTML(item.key)}</small></div><button type="button" data-attraction="${index}">编辑</button></div>`).join('');
    $('#introduction-list').innerHTML = introductions.map((item,index) => `<div class="item"><div><b>${escapeHTML(item.name)}</b><small>${escapeHTML(item.latitude)}, ${escapeHTML(item.longitude)} · ${escapeHTML(item.attractionName || item.attractionKey)}</small></div><button type="button" data-introduction="${index}">编辑坐标</button></div>`).join('');
    $('#relation-list').innerHTML = relations.map(item => `<div class="item"><small>${escapeHTML(item.elementKey)} ↔ ${escapeHTML(item.relatedElementKey)}</small></div>`).join('');
    const elementOptions=options(elements), attractionOptions=options(attractions);
    $('#introduction-element').innerHTML=elementOptions; $('#relation-a').innerHTML=elementOptions; $('#relation-b').innerHTML=elementOptions;
    $('#introduction-attraction').innerHTML=attractionOptions;
    document.querySelectorAll('[data-element]').forEach(button => button.onclick=() => { const item=elements[button.dataset.element]; $('#element-key').value=item.key; $('#element-name').value=item.name; $('#element-text').value=plainText(item.introduction); });
    document.querySelectorAll('[data-attraction]').forEach(button => button.onclick=() => { const item=attractions[button.dataset.attraction]; $('#attraction-key').value=item.key; $('#attraction-name').value=item.name; });
    document.querySelectorAll('[data-introduction]').forEach(button => button.onclick=() => { const item=introductions[button.dataset.introduction]; $('#introduction-key').value=item.key; $('#introduction-name').value=item.name; $('#introduction-text').value=plainText(item.introduction); $('#introduction-element').value=item.culturalElementKey; $('#introduction-attraction').value=item.attractionKey; $('#latitude').value=item.latitude; $('#longitude').value=item.longitude; window.scrollTo({top:$('#introduction-form').offsetTop-20,behavior:'smooth'}); });
  }

  $('#refresh').onclick=() => refresh().catch(error => show(error.message));
  $('#element-form').onsubmit=async event => { event.preventDefault(); const key=$('#element-key').value.trim(); const body={key,name:$('#element-name').value.trim(),introduction:richText($('#element-text').value)}; try { await request(`/v1/admin/cultural-elements/${encodeURIComponent(key)}`,{method:'PUT',body:JSON.stringify(body)}); await refresh(); } catch(error) { show(error.message); } };
  $('#attraction-form').onsubmit=async event => { event.preventDefault(); const key=$('#attraction-key').value.trim(); const body={key,name:$('#attraction-name').value.trim()}; try { await request(`/v1/admin/attractions/${encodeURIComponent(key)}`,{method:'PUT',body:JSON.stringify(body)}); await refresh(); } catch(error) { show(error.message); } };
  $('#introduction-form').onsubmit=async event => { event.preventDefault(); const key=$('#introduction-key').value.trim(); const body={key,name:$('#introduction-name').value.trim(),introduction:richText($('#introduction-text').value),culturalElementKey:$('#introduction-element').value,attractionKey:$('#introduction-attraction').value,latitude:Number($('#latitude').value),longitude:Number($('#longitude').value)}; try { await request(`/v1/admin/attraction-introductions/${encodeURIComponent(key)}`,{method:'PUT',body:JSON.stringify(body)}); await refresh(); } catch(error) { show(error.message); } };
  $('#relation-form').onsubmit=async event => { event.preventDefault(); const a=$('#relation-a').value,b=$('#relation-b').value; try { await request(`/v1/admin/cultural-element-relations/${encodeURIComponent(a)}/${encodeURIComponent(b)}`,{method:'PUT',body:'{}'}); await refresh(); } catch(error) { show(error.message); } };
  refresh().catch(error => show(error.message));
</script>
</body>
</html>
