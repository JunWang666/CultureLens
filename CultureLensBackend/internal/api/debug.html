<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CultureLens API 调试台</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f4f0e7;
      --surface: rgba(255, 253, 247, 0.88);
      --ink: #172436;
      --muted: #68717b;
      --line: rgba(23, 36, 54, 0.14);
      --accent: #a5482d;
      --accent-soft: rgba(165, 72, 45, 0.1);
      --success: #2f7251;
      --danger: #b13d32;
      --code: #13202f;
      --code-ink: #e7edf4;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(180, 107, 68, 0.13), transparent 32rem),
        linear-gradient(145deg, #f8f5ed 0%, var(--paper) 58%, #ebe4d7 100%);
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: ui-serif, "Songti SC", serif;
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .subtitle {
      max-width: 660px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .link, button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .link { padding: 9px 12px; font-size: 13px; }
    .link:hover, button:hover { border-color: rgba(165, 72, 45, 0.5); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: 0.6; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      background: var(--surface);
      box-shadow: 0 16px 50px rgba(55, 43, 27, 0.07);
      backdrop-filter: blur(18px);
    }

    h2 { margin: 0 0 6px; font-size: 19px; }
    .hint { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }

    label {
      display: grid;
      gap: 7px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.03em;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--ink);
      font: 14px ui-monospace, "SFMono-Regular", Menlo, monospace;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .row { display: grid; grid-template-columns: 1fr 112px; gap: 12px; }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }

    .primary {
      border-color: var(--accent);
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .quick button { padding: 6px 9px; color: var(--muted); font-size: 12px; }

    .response {
      margin-top: 16px;
      padding: 0;
      overflow: hidden;
    }

    .response-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .meta { min-width: 0; }
    .request-url { margin-top: 5px; overflow-wrap: anywhere; color: var(--muted); font: 12px ui-monospace, Menlo, monospace; }
    .status { flex: none; border-radius: 999px; padding: 6px 10px; background: rgba(104, 113, 123, 0.12); font-size: 12px; font-weight: 750; }
    .status.ok { color: var(--success); background: rgba(47, 114, 81, 0.12); }
    .status.error { color: var(--danger); background: rgba(177, 61, 50, 0.12); }

    pre {
      min-height: 280px;
      max-height: 56vh;
      margin: 0;
      overflow: auto;
      padding: 20px;
      background: var(--code);
      color: var(--code-ink);
      font: 13px/1.62 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      tab-size: 2;
    }

    @media (max-width: 760px) {
      main { width: min(100% - 20px, 680px); padding-top: 28px; }
      header { display: block; }
      .links { justify-content: flex-start; margin-top: 18px; }
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .response-head { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111820;
        --surface: rgba(26, 35, 44, 0.88);
        --ink: #edf0f2;
        --muted: #aab2ba;
        --line: rgba(255, 255, 255, 0.12);
        --accent: #d77b5d;
        --accent-soft: rgba(215, 123, 93, 0.14);
        --code: #0a1017;
      }
      body { background: radial-gradient(circle at 8% 0%, rgba(165, 72, 45, 0.18), transparent 32rem), #111820; }
      input { background: rgba(0, 0, 0, 0.2); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">CultureLens Backend</p>
        <h1>知识接口调试台</h1>
        <p class="subtitle">直接查询文化元素关联，以及指定坐标附近的景点文化介绍。页面不保存输入，也不会把请求发送到其他主机。</p>
      </div>
      <nav class="links" aria-label="辅助链接">
        <a class="link" href="/admin">内容管理</a>
        <a class="link" href="/docs">API 文档</a>
        <a class="link" href="/openapi.json">OpenAPI JSON</a>
        <a class="link" href="/health">健康检查</a>
      </nav>
    </header>

    <section class="grid" aria-label="知识接口表单">
      <form class="card" id="related-form">
        <h2>查询关联文化元素</h2>
        <p class="hint">按稳定 key 查询显式维护的无向关联。</p>
        <label>
          Element Key
          <input id="element-key" required value="timber-bracket" placeholder="例如：timber-bracket" autocomplete="off" spellcheck="false">
        </label>
        <label>
          Limit
          <input id="related-limit" type="number" min="1" max="20" value="12">
        </label>
        <div class="actions">
          <button class="primary" type="submit">发送请求</button>
        </div>
      </form>

      <form class="card" id="recommend-form">
        <h2>按位置推荐</h2>
        <p class="hint">按 WGS84 经纬度计算球面距离，仅返回半径内的数据。</p>
        <div class="row">
          <label>
            Latitude
            <input id="latitude" type="number" min="-90" max="90" step="any" value="30.248963" required>
          </label>
          <label>
            Longitude
            <input id="longitude" type="number" min="-180" max="180" step="any" value="120.148691" required>
          </label>
        </div>
        <label>
          Radius Meters
          <input id="radius-meters" type="number" min="1" max="50000" step="any" value="5000">
        </label>
        <label>
          Limit
          <input id="recommend-limit" type="number" min="1" max="20" value="12">
        </label>
        <div class="actions">
          <button class="primary" type="submit">发送请求</button>
        </div>
      </form>
    </section>

    <section class="card response" aria-live="polite">
      <div class="response-head">
        <div class="meta">
          <strong>响应</strong>
          <div class="request-url" id="request-url">尚未发送请求</div>
        </div>
        <div class="status" id="status">READY</div>
      </div>
      <pre id="response-json">选择一个接口并发送请求。</pre>
    </section>
  </main>

  <script>
    const responseJSON = document.querySelector('#response-json');
    const requestURL = document.querySelector('#request-url');
    const status = document.querySelector('#status');
    let activeController;

    function setBusy(form, busy) {
      form.querySelectorAll('button, input').forEach(element => element.disabled = busy);
    }

    async function request(path, form) {
      if (activeController) activeController.abort();
      activeController = new AbortController();
      setBusy(form, true);
      requestURL.textContent = new URL(path, window.location.href).href;
      status.className = 'status';
      status.textContent = 'LOADING';
      responseJSON.textContent = '请求中…';
      const startedAt = performance.now();

      try {
        const response = await fetch(path, {
          headers: { 'Accept': 'application/json' },
          signal: activeController.signal
        });
        const elapsed = Math.round(performance.now() - startedAt);
        const text = await response.text();
        let payload;
        try { payload = JSON.parse(text); } catch { payload = text; }
        const requestID = response.headers.get('X-Request-ID') || '—';
        status.className = `status ${response.ok ? 'ok' : 'error'}`;
        status.textContent = `${response.status} · ${elapsed} ms`;
        responseJSON.textContent = JSON.stringify({ requestID, response: payload }, null, 2);
      } catch (error) {
        if (error.name === 'AbortError') return;
        status.className = 'status error';
        status.textContent = 'NETWORK ERROR';
        responseJSON.textContent = JSON.stringify({ error: error.message }, null, 2);
      } finally {
        setBusy(form, false);
      }
    }

    document.querySelector('#related-form').addEventListener('submit', event => {
      event.preventDefault();
      const key = document.querySelector('#element-key').value.trim();
      const limit = document.querySelector('#related-limit').value;
      request(`/v1/cultural-elements/${encodeURIComponent(key)}/related?limit=${encodeURIComponent(limit)}`, event.currentTarget);
    });

    document.querySelector('#recommend-form').addEventListener('submit', event => {
      event.preventDefault();
      const params = new URLSearchParams();
      params.set('latitude', document.querySelector('#latitude').value);
      params.set('longitude', document.querySelector('#longitude').value);
      params.set('radiusMeters', document.querySelector('#radius-meters').value);
      params.set('limit', document.querySelector('#recommend-limit').value);
      request(`/v1/attraction-introductions/recommendations?${params}`, event.currentTarget);
    });
  </script>
</body>
</html>
